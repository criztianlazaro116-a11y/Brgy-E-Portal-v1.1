<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Login | E-Barangay Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-200">
        <a href="../index.html" class="text-sm text-indigo-600 hover:underline">&larr; Back to Main Website</a>
        <div class="text-center mt-3 mb-6">
            <span class="text-4xl">🏛️</span>
            <h2 class="text-2xl font-bold text-gray-900 mt-2">Barangay Admin Portal</h2>
            <p class="text-xs text-gray-500">Authorized Barangay Personnel Only</p>
        </div>

        <form action="./dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Official Staff ID / Username</label>
                <input type="text" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="ADMIN-2026-01">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-900 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-950">Access Admin Dashboard</button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-6">
            Need an official account? <a href="./register.html" class="text-indigo-600 font-semibold hover:underline">Request Staff Account</a>
        </p>
    </div>

</body>
</html>

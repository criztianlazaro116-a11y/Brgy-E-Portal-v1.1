<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Login | E-Barangay</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border">
        <a href="../index.html" class="text-sm text-blue-600 hover:underline">&larr; Back to Main Website</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-1">Resident Login</h2>
        <p class="text-sm text-gray-500 mb-6">Enter your details to access your account</p>

        <form action="./dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email or Mobile Number</label>
                <input type="text" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="juan@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">Sign In</button>
        </form>

        <p class="text-sm text-center text-gray-600 mt-6">
            Don't have an account? <a href="./register.html" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>

</body>
</html>
